name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The web app's checks: what it regenerates from the spec (api.gen.go, api.d.ts) is
  # committed, and it passes its linters.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app; generated code is committed
        run: |
          go generate ./api
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
          git diff --exit-code
      - name: Lint and check formatting
        run: |
          npm run lint --prefix web
          npm run format:check --prefix web
          npm run lint:api --prefix web

  # go vet, staticcheck, errcheck and the rest, with gofmt and goimports (.golangci.yml).
  # It needs no built app: the embed finds the committed CSS.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # The tests, split across runners by name: each runs every third.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prospector
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROSPECTOR_TEST_PG: postgres://postgres:test@localhost:5432/prospector?sslmode=disable
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tests read the built app.
      - name: Build the web app
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      # A throwaway database needn't survive a crash, and syncing every commit to disk
      # is most of what a test spends.
      - name: Don't make the test database durable
        run: |
          psql "$PROSPECTOR_TEST_PG" -c "alter system set fsync = off" -c "alter system set synchronous_commit = off" \
            -c "alter system set full_page_writes = off" -c "select pg_reload_conf()"
      # go vet is the lint job's (golangci's govet); run again here it is most of the build.
      - name: Test
        run: |
          names=$(go test -vet=off -list . . | grep '^Test' | sort | awk -v n=3 -v i="$SHARD" 'NR % n == i' | paste -sd'|')
          test -n "$names"
          go test -vet=off -count=1 -run "^($names)\$" .

  # The one check main requires: everything above passed.
  test:
    if: always()
    needs: [web, lint, tests]
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Everything passed
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'

  # Every green push to main becomes the next patch release, which deploy.yml installs.
  # A tag pushed with GITHUB_TOKEN doesn't start release.yml, so goreleaser runs here.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tag the next patch version
        id: tag
        run: |
          # Also when a later commit was released first: this one is already in that
          # release, and tagging it now would make the older commit the newest.
          if git tag --contains HEAD --list 'v*' | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major:-0}.${minor:-1}.$(( ${patch:-0} + 1 ))"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        if: steps.tag.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    if: needs.release.outputs.tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit
