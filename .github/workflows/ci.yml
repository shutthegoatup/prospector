name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: prospector
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Generated templates and API code are committed
        run: |
          go tool templ generate
          go generate ./api
          git diff --exit-code

      - run: go vet ./...
      - name: Test on SQLite
        run: go test ./...
      - name: Test on Postgres
        run: go test -count=1 -p 1 ./...
        env:
          PROSPECTOR_TEST_PG: postgres://postgres:test@localhost:5432/prospector?sslmode=disable

  # Every green push to main becomes the next patch release, which deploy.yml installs.
  # A tag pushed with GITHUB_TOKEN doesn't start release.yml, so goreleaser runs here.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Tag the next patch version
        id: tag
        run: |
          # Also when a later commit was released first: this one is already in that
          # release, and tagging it now would make the older commit the newest.
          if git tag --contains HEAD --list 'v*' | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major:-0}.${minor:-1}.$(( ${patch:-0} + 1 ))"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        if: steps.tag.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release
    if: needs.release.outputs.tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit
