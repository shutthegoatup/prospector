name: deploy

# Installs a published release on the host. ci.yml calls this with each release it
# cuts; run it by hand with an earlier version to go back.
#
# There is no stored key. The host's certificate authority signs this workflow's
# identity a certificate that lasts minutes, and the account it reaches runs one
# command, which takes a version and fetches that release from GitHub itself.
# Where to connect is in the DEPLOY_* secrets; without them this does nothing.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release to install, e.g. 0.1.22
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      CA_ADDR: ${{ secrets.DEPLOY_CA_ADDR }}
      CA_ROLE: ${{ secrets.DEPLOY_CA_ROLE }}
      CA_PRINCIPAL: ${{ secrets.DEPLOY_CA_PRINCIPAL }}
      TARGET: ${{ secrets.DEPLOY_TARGET }}
    steps:
      - name: Settle what to install
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          case "$version" in
            *[!0-9.]*|.*|*.|"")
              echo "version must look like 0.1.22" >&2
              exit 1 ;;
          esac
          if [ -z "$CA_ADDR" ] || [ -z "$CA_ROLE" ] || [ -z "$CA_PRINCIPAL" ] || [ -z "$TARGET" ]; then
            echo "::notice::The DEPLOY_* secrets are not set, so $version was not installed anywhere."
            exit 0
          fi
          # A release cut from an older commit must not replace a newer one. By hand, any
          # release may be installed.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "${latest#v}" != "$version" ]; then
              echo "::notice::$version is no longer the latest release ($latest is); leaving it to that one."
              exit 0
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get a certificate
        if: steps.plan.outputs.version
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          id_token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CA_ADDR" | jq -er .value)

          ca_token=$(curl -sS -X POST "$CA_ADDR/v1/auth/jwt/login" \
            --data "$(jq -cn --arg r "$CA_ROLE" --arg j "$id_token" \
              '{role: $r, jwt: $j}')" | jq -er .auth.client_token)
          echo "::add-mask::$ca_token"

          ssh-keygen -q -t ed25519 -N '' -C "$GITHUB_REPOSITORY@$GITHUB_RUN_ID" -f ~/.ssh/ci

          curl -sS -X POST "$CA_ADDR/v1/ssh-client-signer/sign/$CA_PRINCIPAL" \
            -H "X-Vault-Token: $ca_token" \
            --data "$(jq -cn --arg k "$(cat ~/.ssh/ci.pub)" '{public_key: $k}')" \
            | jq -er .data.signed_key > ~/.ssh/ci-cert.pub

      # The host switches back by itself if the release does not come up healthy, so a
      # failure here means the previous release is still the one running.
      - name: Install the release
        if: steps.plan.outputs.version
        env:
          RELEASE: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "${TARGET#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/ci -o BatchMode=yes "$TARGET" "deploy $RELEASE"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/ci ~/.ssh/ci-cert.pub
