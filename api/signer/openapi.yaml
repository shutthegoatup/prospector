openapi: 3.0.3
info:
  title: Prospector signing
  version: "1"
  description: |
    What someone outside an organisation uses to sign an agreement they were sent. They
    have no account: a link mailed to them opens a session in one browser, and an emailed
    code proves it. Every operation after opening goes by that session's cookie, which
    names one recipient of one agreement. No API key or member session reaches these.
servers:
  - url: /
security:
  - signer: []
tags:
  - name: signing
    description: Signing an agreement from an emailed link.
paths:
  /s/api/v1/open:
    post:
      operationId: openSigning
      tags: [signing]
      summary: Open a session from a mailed link
      description: Nothing is shown of the agreement but its name and who sent it until the code is given.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string, description: "The token at the end of the mailed link." }
      responses:
        "200":
          description: The session, set as a cookie, and what it can see.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signing" }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/signing:
    get:
      operationId: getSigning
      tags: [signing]
      summary: What this session can see and do
      responses:
        "200":
          description: The signing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signing" }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/code:
    post:
      operationId: sendSigningCode
      tags: [signing]
      summary: Email a code to the address the agreement was sent to
      description: One a minute at most, ten a day to a person. It lasts ten minutes.
      responses:
        "200":
          description: Where it went, partly hidden.
          content:
            application/json:
              schema:
                type: object
                required: [sent_to]
                properties:
                  sent_to: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/code/check:
    post:
      operationId: checkSigningCode
      tags: [signing]
      summary: Give the emailed code back
      description: Five tries a code; thirty wrong codes in all end the link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: The signing, now proven.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signing" }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/document:
    get:
      operationId: getSigningDocument
      tags: [signing]
      summary: The document as it was sent
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/sealed:
    get:
      operationId: getSealedDocument
      tags: [signing]
      summary: The signed and sealed copy, once everyone has signed
      responses:
        "200":
          description: The sealed PDF, with its certificate as the last page.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/sign:
    post:
      operationId: signAgreement
      tags: [signing]
      summary: Sign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignIn" }
      responses:
        "200":
          description: The signing, signed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signing" }
        default: { $ref: "#/components/responses/Problem" }
  /s/api/v1/decline:
    post:
      operationId: declineAgreement
      tags: [signing]
      summary: Decline to sign
      description: The agreement ends, and the sender is told, with the reason given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: The signing, declined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signing" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    signer:
      type: apiKey
      in: cookie
      name: signer
      description: A browser's signing session, opened from a mailed link.
  responses:
    Problem:
      description: What went wrong (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    SignIn:
      type: object
      required: [typed_name, consent]
      properties:
        typed_name: { type: string, maxLength: 120, description: "The signer's full name, typed: their signature." }
        consent: { type: boolean, description: "That they agree to sign electronically, in the wording the page shows." }
        values:
          type: array
          items:
            type: object
            required: [field, value]
            properties:
              field: { type: integer, format: int64 }
              value: { type: string, maxLength: 200, description: "Text typed in, or anything for a ticked box and empty for one left." }
    Signing:
      type: object
      required: [org, agreement, sent_to, proven, state, consent, signers]
      properties:
        org: { type: string, description: "Who sent it, as they were called when it was sent." }
        agreement: { type: string }
        sent_to: { type: string, description: "The address the code goes to, partly hidden." }
        proven: { type: boolean, description: "Whether this browser has given the emailed code." }
        state:
          type: string
          enum: [sign, waiting, signed, declined, sealing, completed, voided, expired, copy]
          description: |
            sign: it's their turn; waiting: someone before them signs first; signed: they have;
            declined: someone declined it; sealing: everyone has, it's being sealed; completed: the
            sealed copy is ready; voided and expired: it can't be signed; copy: they get a copy only.
        consent: { type: string, description: "What signing agrees to, word for word." }
        name: { type: string, description: "The name it was sent to; empty until the code is given." }
        message: { type: string, description: "What the sender wrote; empty until the code is given." }
        pages: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        signers:
          type: array
          description: Who signs, in order, and whether they have; empty until the code is given.
          items:
            type: object
            required: [name, signed, you]
            properties:
              name: { type: string }
              signed: { type: boolean }
              you: { type: boolean }
        fields:
          type: array
          description: This signer's places on the document; empty until the code is given.
          items:
            type: object
            required: [id, page, kind, label, x, y, w, h]
            properties:
              id: { type: integer, format: int64 }
              page: { type: integer }
              kind: { type: string, enum: [signature, initials, name, date, text, tick] }
              label: { type: string }
              x: { type: number }
              y: { type: number }
              w: { type: number }
              h: { type: number }
