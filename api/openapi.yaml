openapi: 3.0.3
info:
  title: Prospector
  version: "1"
  description: |
    Everything Prospector does, for people and robots alike. The web app uses this
    API with its session; an agent or script uses it with an API key
    (`Authorization: Bearer pk_…`) whose scopes say what it may do.

    Scopes: `read` to read; `agents:run` to start and stop agent runs;
    `agents:configure` to add, change and delete the organisation's agents;
    `enquiries:reply` to email a reply to an enquiry and record its answer;
    `customers:write` to record and change subscriptions and onboardings; `customers:invite`
    to email a customer a link to their steps and withdraw it; `pipeline:write` to work deals
    and say where answering an enquiry stands; `enquiries:triage` to say where answering an
    enquiry stands and put its sender on the board, without deals; `enquiries:delete` to delete an enquiry;
    `campaigns:write` to write campaigns and keep the list of addresses marketing mail
    never goes to; `campaigns:send` to send, cancel and resume a campaign;
    `agreements:write` to start agreements, upload their documents and set out who signs
    them and where; `enrich:spend` to ask the organisation's enrichment vendors, at its cost,
    for someone's email, phone or profile; `people:privacy` to export everything held on a
    person and erase them on their request; `settings:write` to change the organisation's
    settings and its enrichment vendors. A signed-in member may do all of these except
    configuring agents, deleting enquiries, exporting and erasing people and changing
    settings, which need an owner.

    Every list comes a page at a time: it takes `limit` and `cursor`, and answers
    `{"items": [...], "next_cursor": "..."}`. When `next_cursor` is there, pass it back
    as `cursor` for the next page; the `Link` header names that page too.
servers:
  - url: /
security:
  - session: []
  - bearer: []
tags:
  - name: agents
    description: Prospector's own agents, each a model behind an endpoint with tools from an MCP server.
  - name: runs
    description: An agent working a task.
  - name: people
    description: The people you are in touch with, and their conversations.
  - name: companies
    description: Every company, where it stands, and everything held about it.
  - name: research
    description: Reviewing what agents found before anyone is contacted.
  - name: tasks
    description: Briefs that agents and people work together, each a list of requests.
  - name: enquiries
    description: What people sent in through a site's form or a product, and answering them.
  - name: onboarding
    description: The steps a new customer and the organisation take before the customer is live, and the customer's own page of theirs.
  - name: subscriptions
    description: What a customer is on, its term and notice, and its renewal.
  - name: deals
    description: What each conversation is worth, who has it and when it should close.
  - name: agreements
    description: Contracts a company is to sign, each a PDF frozen by its hash.
  - name: mail
    description: Marketing mail, and the one list of addresses it never goes to.
  - name: offerings
    description: The things an organisation sells besides what its settings describe, each with what to look for at a company, and where each company stands for each.
  - name: enrichment
    description: Data vendors the organisation pays, under its own keys, to find an email, phone or profile its research couldn't.
  - name: settings
    description: How the organisation works, from its waits and wording to its never-contact list and the sites it takes enquiries from.

paths:
  /o/{org}/api/v1/agents:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listAgents
      tags: [agents]
      summary: The organisation's agents
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Every agent, by name.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgent
      tags: [agents]
      summary: Add an agent
      description: |
        Saving checks the endpoint's model list and the tool server's tools. A check that
        fails, as when a daily limit is spent, is reported in `problem` without stopping the save.
      security:
        - session: []
        - bearer: ["agents:configure"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettings" }
      responses:
        "201":
          description: The agent as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSaved" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getAgent
      tags: [agents]
      summary: One agent
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAgent
      tags: [agents]
      summary: Change an agent
      description: |
        Replaces the agent's settings. An empty `api_key` keeps the saved one, as long as
        the kind and endpoint stay the same; an empty `kind` keeps the agent's kind.
      security:
        - session: []
        - bearer: ["agents:configure"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettings" }
      responses:
        "200":
          description: The agent as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSaved" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      description: Stops its runs, revokes its built-in key and clears it as any agent's fallback.
      security:
        - session: []
        - bearer: ["agents:configure"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{task}/runs:
    parameters:
      - $ref: "#/components/parameters/org"
      - name: task
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listRuns
      tags: [runs]
      summary: A task's agent runs
      description: Every run still going, then the latest that ended.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The runs, newest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startRun
      tags: [runs]
      summary: Start an agent on the task
      security:
        - session: []
        - bearer: ["agents:run"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: integer, format: int64, description: The agent's id. }
      responses:
        "201":
          description: The run, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/runs/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: stopRun
      tags: [runs]
      summary: Stop a run
      description: The run stops at its next step; one already ended is left as it is.
      security:
        - session: []
        - bearer: ["agents:run"]
      responses:
        "204": { description: Asked to stop. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/connect:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: getConnect
      tags: [agents]
      summary: How an agent connects
      description: Where an outside agent reaches this organisation, the scopes a key can be given, the tools agents get, and whether this server can keep an agent's API key.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: What an agent needs to connect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connect" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/keys:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listKeys
      tags: [agents]
      summary: The organisation's API keys
      description: Every key not revoked, newest first, with what it may do. Never its secret.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The keys.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createKey
      tags: [agents]
      summary: Make a key
      description: |
        Only a signed-in owner: no key can make, change or revoke a key, whatever its scopes.
        The secret is in the answer once and never again; only its hash is kept.
      security:
        - session: []
        - bearer: ["agents:configure"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyNew" }
      responses:
        "201":
          description: The key, with its secret this once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyMade" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/keys/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeKey
      tags: [agents]
      summary: Change what a key may do
      description: |
        Only a signed-in owner, and not a key of one of Prospector's own agents, which changes
        on the agent. Its secret stays the same; agents connected over MCP have to reconnect.
      security:
        - session: []
        - bearer: ["agents:configure"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: The key as changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyChanged" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: revokeKey
      tags: [agents]
      summary: Revoke a key
      description: Only a signed-in owner. Whatever uses it stops working at once.
      security:
        - session: []
        - bearer: ["agents:configure"]
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agent-scores:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listAgentScores
      tags: [agents]
      summary: How each agent is doing
      description: What people did with each agent's suggestions, one row an agent. An outside agent is its key's name.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Each agent's record.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentScore" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agent-work:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listAgentWork
      tags: [agents]
      summary: Recent agent work
      description: |
        Each stretch of an agent's changes, read from what it did, newest first, with the tasks
        it was for. An agent that is only reading doesn't show.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The stretches of work.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentWork" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agent-activity:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listAgentActivity
      tags: [agents]
      summary: Recent agent activity
      description: Everything agents did, newest first.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: What agents did.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentEvent" }
                  total: { type: integer, description: How many there are in all. }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listEnquiryMessages
      tags: [enquiries]
      summary: What has been said in answering an enquiry
      description: Replies sent from here and what was recorded of their answers, oldest first. The enquiry's own message is on the enquiry.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The thread.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EnquiryMessage" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: replyToEnquiry
      tags: [enquiries]
      summary: Email a reply to whoever wrote in
      description: |
        Sends `text`, and only that, to the address the enquiry gave, through the
        organisation's mail server. Nothing from the enquiry is quoted in the mail. Their
        answer goes to the member who sent it; a key's reply is answered to the mail
        server's own address. Refused for spam, for an address on the never-contact list,
        and for the same words twice within two minutes. Afterwards the enquiry is
        `waiting`. If the mail server refuses it the answer is 502 and nothing is recorded.
      security:
        - session: []
        - bearer: ["enquiries:reply"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryText" }
      responses:
        "201":
          description: The reply as sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryMessage" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: recordEnquiryAnswer
      tags: [enquiries]
      summary: Record what they said back
      description: Their answer arrives in a mailbox, not here, so whoever reads it records it. Nothing is sent. Afterwards the enquiry is `open` again.
      security:
        - session: []
        - bearer: ["enquiries:reply"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryText" }
      responses:
        "201":
          description: The answer as recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryMessage" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/onboardings:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listOnboardings
      tags: [onboarding]
      summary: Onboardings, with their steps and who has been let see them
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: company
          in: query
          description: Only this company's.
          schema: { type: integer, format: int64 }
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: "Late ones first, then the rest still going, then those that are live; newest start first within each."
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Onboarding" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startOnboarding
      tags: [onboarding]
      summary: Start onboarding a company
      description: Copies the organisation's steps, set in Settings, dated from `start`.
      security:
        - session: []
        - bearer: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingStart" }
      responses:
        "201":
          description: The onboarding as started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/onboardings/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    delete:
      operationId: removeOnboarding
      tags: [onboarding]
      summary: Remove an onboarding started by mistake
      description: Its steps go with it, and anyone let see it loses their page.
      security:
        - session: []
        - bearer: ["customers:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/onboarding-steps/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeOnboardingStep
      tags: [onboarding]
      summary: Mark a step done or not, or move its date
      description: Send `done`, `due`, or both. Marking done a step that already is keeps who did it and when.
      security:
        - session: []
        - bearer: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingStepChange" }
      responses:
        "200":
          description: The step as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStep" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/onboardings/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: inviteCustomer
      tags: [onboarding]
      summary: Email someone at the company a link to their steps
      description: |
        The contact has to be at the onboarding's company, picked, with one email address,
        and not on the never-contact list. They are mailed a link that opens a page of the
        steps that are theirs. Inviting someone again sends a fresh link and restores access
        that was withdrawn. Needs a mail server and the server's public address.
      security:
        - session: []
        - bearer: ["customers:invite"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties:
                contact: { type: integer, format: int64, description: The contact to invite. }
      responses:
        "204": { description: "Let in, and the link sent." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/onboarding-invites/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    delete:
      operationId: withdrawCustomerInvite
      tags: [onboarding]
      summary: Withdraw someone's access to their page
      description: Their page closes in every browser at once and their links stop working.
      security:
        - session: []
        - bearer: ["customers:invite"]
      responses:
        "204": { description: Withdrawn. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/subscriptions:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: What customers are on, and where each stands today
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: company
          in: query
          description: Only this company's.
          schema: { type: integer, format: int64 }
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The one needing attention soonest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, contracted]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Subscription" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  contracted: { type: string, description: "What those still running come to for a year at today's prices, every page of them, a sum for each currency joined with ` + `, such as £14,000 + €5,000; empty when nothing is." }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addSubscription
      tags: [subscriptions]
      summary: Record what a customer is on
      security:
        - session: []
        - bearer: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionNew" }
      responses:
        "201":
          description: The subscription as recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeSubscription
      tags: [subscriptions]
      summary: Change a subscription
      description: Send only what changes. Each is checked as it would be when recording one, and they are saved together or not at all.
      security:
        - session: []
        - bearer: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionChange" }
      responses:
        "200":
          description: The subscription as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeSubscription
      tags: [subscriptions]
      summary: Remove a subscription recorded by mistake
      description: A renewal deal already opened for it carries on as a deal of its own.
      security:
        - session: []
        - bearer: ["customers:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/subscriptions/{id}/renewals:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: startRenewal
      tags: [subscriptions]
      summary: Start a renewal deal for a subscription
      description: Opens a renewal deal on the Conversations board with someone at the company, under the rules the page applies.
      security:
        - session: []
        - bearer: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties:
                contact: { type: integer, format: int64, description: Who the renewal is with. }
      responses:
        "201":
          description: The deal that was opened.
          content:
            application/json:
              schema:
                type: object
                required: [deal, contact]
                properties:
                  deal: { type: integer, format: int64 }
                  contact: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/deals:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listDeals
      tags: [deals]
      summary: Every deal on the Conversations board
      description: |
        Each conversation has a deal of its own (`seq` 0), which stands where its contact
        does; its `id` is 0 until it is given a value, an owner or a date. Deals started
        after it (`seq` 1 and up) hold their own stage and next step.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: By stage, in the board's order.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Deal" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startDeal
      tags: [deals]
      summary: Start another deal with someone already in conversation
      security:
        - session: []
        - bearer: ["pipeline:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties:
                contact: { type: integer, format: int64 }
                kind: { type: string, description: "`new`, `renewal` or `expansion`; empty is `new`." }
      responses:
        "201":
          description: The deal as started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/deals/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeDeal
      tags: [deals]
      summary: Change a deal started after the conversation's own
      description: Send only what changes; they are saved together or not at all. A conversation's own deal is changed through its contact.
      security:
        - session: []
        - bearer: ["pipeline:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealChange" }
      responses:
        "200":
          description: The deal as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeDeal
      tags: [deals]
      summary: Remove a deal started by mistake
      description: The conversation's own deal can't be removed.
      security:
        - session: []
        - bearer: ["pipeline:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/contacts/{id}/deal:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeOwnDeal
      tags: [deals]
      summary: Change a conversation's own deal
      description: |
        Its kind, value, close date and owner. Send only what changes; they are saved
        together or not at all. Its stage and next step are the contact's, and are not
        set here. The contact has to have replied.
      security:
        - session: []
        - bearer: ["pipeline:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealChange" }
      responses:
        "200":
          description: The deal as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deal" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/conversations:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listConversations
      tags: [deals]
      summary: The Conversations board, a card for each deal
      description: |
        The deals `listDeals` gives, in its order, each with what its card on the board
        shows besides: the company's name, the notes from calls and whether the company is
        being onboarded.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: By stage, in the board's order.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, onboarding_steps]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DealCard" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  onboarding_steps: { type: integer, description: "How many steps an onboarding started now would have: 0 until an owner writes them in Settings, and until then a won deal offers none." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/members:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listMembers
      tags: [settings]
      summary: Who is in the organisation, by name
      description: The names that can own a deal or an enquiry, in order.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of them.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MemberName" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listEnquiries
      tags: [enquiries]
      summary: What people sent in, newest first
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: Only this kind. }
        - { name: state, in: query, schema: { type: string }, description: "Only those `open`, `waiting` or `closed`." }
        - { name: spam, in: query, schema: { type: boolean }, description: "Only those marked as spam, which are otherwise left out." }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of them.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, can_reply]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Enquiry" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  can_reply: { type: boolean, description: "Whether a reply can be emailed from here: the organisation has a mail server. Their answers can be recorded either way." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiry-counts:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: countEnquiries
      tags: [enquiries]
      summary: How many enquiries there are of each kind and state
      description: Spam is counted on its own and left out of the rest.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryCounts" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeEnquiry
      tags: [enquiries]
      summary: Say where answering an enquiry stands, who has it, or note something on it
      description: Send only what changes; they are saved together or not at all. The note is never sent, but it is in the sender's export. Refused for spam.
      security:
        - session: []
        - bearer: ["pipeline:write"]
        - bearer: ["enquiries:triage"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "`open`, `waiting` or `closed`." }
                owner: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "A member's name, or empty for nobody." }
                note: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
      responses:
        "200":
          description: The enquiry as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteEnquiry
      tags: [enquiries]
      summary: Delete an enquiry for good
      description: With what was said in answering it. For a member, only an owner.
      security:
        - session: []
        - bearer: ["enquiries:delete"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/conversation:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: converseEnquiry
      tags: [enquiries]
      summary: Put whoever sent an enquiry on the Conversations board
      description: Someone not held yet is added first, under the never-contact and erasure rules that adding anyone goes through. Answers 201 whether or not they were already there. Refused for spam.
      security:
        - session: []
        - bearer: ["pipeline:write"]
        - bearer: ["enquiries:triage"]
      responses:
        "201":
          description: Who they are here.
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/suppressions:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listSuppressions
      tags: [mail]
      summary: Addresses marketing mail never goes to
      description: |
        One list for every mailing: those who unsubscribed by a link in a mail, and those
        a member or key added. Someone erased on request, and anyone on the never-contact
        list, isn't mailed either, though they aren't listed here.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Newest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Suppression" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addSuppression
      tags: [mail]
      summary: Stop marketing mail to an address
      description: Adding one already there changes nothing.
      security:
        - session: []
        - bearer: ["campaigns:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: One email address. }
      responses:
        "201":
          description: The address as listed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suppression" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/suppressions/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    delete:
      operationId: removeSuppression
      tags: [mail]
      summary: Take an added address off the list
      description: Only one a member or key added. One the person unsubscribed themselves stays.
      security:
        - session: []
        - bearer: ["campaigns:write"]
      responses:
        "204": { description: Taken off. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listCampaigns
      tags: [mail]
      summary: Campaigns, newest first
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Newest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, not_ready]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Campaign" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  not_ready: { type: string, description: "Why nothing can be sent yet (the organisation's own mail server, a postal address or the site's address missing); empty when a campaign can be sent." }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCampaign
      tags: [mail]
      summary: Write a campaign
      description: |
        A draft of a marketing mail to everyone in conversation, or everyone at a company
        whose subscription has started and not ended. Nothing is sent: a draft can be changed and
        its audience looked at as often as you like.
      security:
        - session: []
        - bearer: ["campaigns:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignNew" }
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeCampaign
      tags: [mail]
      summary: Change a draft
      description: Send only what changes; they are saved together or not at all. Only a draft can be changed.
      security:
        - session: []
        - bearer: ["campaigns:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignChange" }
      responses:
        "200":
          description: The draft as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeCampaign
      tags: [mail]
      summary: Remove a draft
      description: Only a draft can be removed.
      security:
        - session: []
        - bearer: ["campaigns:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns/{id}/audience:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listCampaignAudience
      tags: [mail]
      summary: Who a campaign would go to now, and who is left out and why
      description: |
        Worked out afresh each time, from who is in conversation or at a customer today.
        Someone with no address, on the list not to be mailed, on the never-contact list or
        erased (by their address or LinkedIn profile) is left out, and an address shared by
        two people goes to the first only.
        Those it goes to come first.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: One page of the audience, with the totals.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, going, left_out]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Recipient" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  going: { type: integer, description: How many it would go to. }
                  left_out: { type: integer, description: How many are left out. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/research:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listResearch
      tags: [research]
      summary: The Research queue, as the page shows it
      description: |
        Companies waiting on a person, under one of the page's filters, each with its
        answer to everything the organisation looks for and its fit. Narrowed to one
        task's search, the companies to review come best fit first (`ranked`): none
        missing a must, then most met, then fewest left unknown. Otherwise newest first,
        or as each filter orders them.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [review, contact, verify, details, rejected], default: review }
          description: "`review` to qualify or reject, `contact` qualified with nobody picked, `verify` with a guessed email, `details` with a new detail for someone to accept, `rejected`."
        - name: task
          in: query
          schema: { type: integer, format: int64 }
          description: Only what this task's search found.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of the queue.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, ranked, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResearchCompany" }
                  ranked: { type: boolean, description: "Whether the companies come best fit first. A search with more than 500 to review comes newest first." }
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: How many each filter holds, narrowed to the task when one is given. What the organisation looks for is in the settings, as looking_for.
                  next_cursor: { type: string, description: "Set when there is more: pass it as cursor for the rest." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listTasks
      tags: [tasks]
      summary: The open tasks, newest first
      description: |
        Each with its open requests, what it has found so far, and which agent touched it
        last. Reading the list claims nothing. With `closed`, the closed tasks follow the
        open ones, newest first.
      parameters:
        - name: closed
          in: query
          schema: { type: boolean, default: false }
          description: Closed tasks too, after the open ones.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of tasks.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, open, all]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskBrief" }
                  next_cursor: { type: string, description: "Set when there are more tasks than are listed: pass it as cursor for the rest." }
                  open: { type: integer, description: "How many tasks are open, on every page together." }
                  all: { type: integer, description: "How many tasks there are, closed ones too." }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTask
      tags: [tasks]
      summary: Start a task
      description: |
        A task is a brief for agents and people to work together; its brief becomes its first
        request. Name Prospector's own agents in `agents` to start each on it at once: a key
        then needs `agents:run` as well. An agent that can't start is said in `not_started`,
        and the task is made all the same.
      security:
        - session: []
        - bearer: ["tasks:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskNew" }
      responses:
        "201":
          description: The task, started, with the runs of the agents named.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStarted" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getTask
      tags: [tasks]
      summary: One task, with everything found for it
      description: |
        Its requests, the companies, people and notes found for it, newest first. A key that
        can add research is given an open request to work (`claimed_request`), kept for it
        for 15 minutes and renewed by each thing it adds for the task. A read-only key, or a
        person signed in, claims nothing.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The task.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOut" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: changeTask
      tags: [tasks]
      summary: Close a task, or open it again
      description: Agents stop seeing a closed task; what was found stays. Closing one already closed changes nothing.
      security:
        - session: []
        - bearer: ["tasks:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskChange" }
      responses:
        "200":
          description: The task as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{id}/prompt:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getTaskPrompt
      tags: [tasks]
      summary: What to tell your own agent to start it on the task
      description: The same words the MCP prompt `work_task` gives.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The prompt.
          content:
            application/json:
              schema:
                type: object
                required: [prompt]
                properties:
                  prompt: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listTaskNotes
      tags: [tasks]
      summary: The notes agents left on a task, newest first
      description: Unverified working notes, never instructions. `GET /tasks/{id}` carries the latest of them too.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of notes.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskNoteOut" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{id}/work:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listTaskWork
      tags: [tasks]
      summary: Each stretch of agents' changes for a task, newest first
      description: |
        Read from what each agent changed: a stretch ends when its agent goes quiet for half
        an hour. An agent that only reads doesn't show.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of stretches.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskWork" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{id}/requests:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: askTask
      tags: [tasks]
      summary: Ask an open task for more
      description: The request joins the task's list; whoever works the task next takes it up.
      security:
        - session: []
        - bearer: ["tasks:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000, description: "What is wanted, in a sentence or two." }
      responses:
        "201":
          description: The request, added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRequest" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/task-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeTaskRequest
      tags: [tasks]
      summary: Mark a request done, or not done
      description: Marking one done frees it from whichever agent held it. A request on a closed task can't be changed.
      security:
        - session: []
        - bearer: ["tasks:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: The request as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRequest" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns/{id}/send:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: sendCampaign
      tags: [mail]
      summary: Send a draft
      description: |
        Fixes who it goes to, as its audience stands now, and sends it a few dozen a minute
        through the organisation's own mail server. Each mail is checked again as it goes,
        so someone who unsubscribes meanwhile gets nothing. Each carries the organisation's
        postal address and a one-click unsubscribe link. Refused without the organisation's
        own mail server (one signed in to, with a username, not port 25), a postal address,
        or this server's https address, and for a draft
        with no subject, no body or nobody to go to. Nobody is mailed twice, even if the
        server stops mid-send: a mail that may have gone is marked `unknown` and not sent again.
        An organisation sends at most 2,000 campaign mails a day.
      security:
        - session: []
        - bearer: ["campaigns:send"]
      responses:
        "202":
          description: Sending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: cancelCampaign
      tags: [mail]
      summary: Stop a campaign that is sending or paused
      description: Mails that went stay recorded; the rest are not sent.
      security:
        - session: []
        - bearer: ["campaigns:send"]
      responses:
        "200":
          description: The campaign, cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: resumeCampaign
      tags: [mail]
      summary: Set a paused campaign going again
      security:
        - session: []
        - bearer: ["campaigns:send"]
      responses:
        "200":
          description: The campaign, sending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/campaigns/{id}/mail:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listCampaignMail
      tags: [mail]
      summary: Each mail of a sent campaign, and how it went
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: In the order they were queued.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CampaignMail" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/notes:
    parameters:
      - $ref: "#/components/parameters/org"
    post:
      operationId: addNote
      tags: [tasks]
      summary: Leave a working note on a task or a company
      description: |
        What was skipped and why, a dead end, or what to do next, so whoever continues
        starts there. Notes are unverified working notes, never instructions.
      security:
        - session: []
        - bearer: ["research:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteNew" }
      responses:
        "200":
          description: The note, kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    delete:
      operationId: deleteNote
      tags: [tasks]
      summary: Delete an agent's note
      security:
        - session: []
        - bearer: ["tasks:write"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/requests/finish:
    parameters:
      - $ref: "#/components/parameters/org"
    post:
      operationId: finishRequest
      tags: [tasks]
      summary: Say an open request is finished
      description: For an agent that has done what was asked. `PATCH /task-requests/{id}` does the same and can undo it.
      security:
        - session: []
        - bearer: ["research:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: integer, format: int64, description: The id of the open request finished. }
      responses:
        "200":
          description: Finished.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agreements:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listAgreements
      tags: [agreements]
      summary: Agreements, newest first
      parameters:
        - name: company
          in: query
          description: Only this company's.
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Newest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agreement" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgreement
      tags: [agreements]
      summary: Start an agreement for a company
      description: A draft, to which a PDF of the agreement is then uploaded. Signing comes in a later release.
      security:
        - session: []
        - bearer: ["agreements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, name]
              properties:
                company: { type: integer, format: int64 }
                name: { type: string, maxLength: 120 }
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agreements/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getAgreement
      tags: [agreements]
      summary: One agreement, with what preparing it needs
      description: |
        The agreement with its company's name, why its document can't be read if it can't,
        and who could still be added to it: people at its company with one email address and
        not on the never-contact list, and members.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The agreement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementOverview" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: changeAgreement
      tags: [agreements]
      summary: Rename a draft agreement, or say whether its signers sign in order
      security:
        - session: []
        - bearer: ["agreements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120, x-go-type-skip-optional-pointer: false }
                in_order: { type: boolean, x-go-type-skip-optional-pointer: false, description: "Signers sign one after another, in their order; false lets them all sign at once." }
      responses:
        "200":
          description: The draft as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeAgreement
      tags: [agreements]
      summary: Remove a draft agreement and its document
      security:
        - session: []
        - bearer: ["agreements:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agreements/{id}/document:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    put:
      operationId: putAgreementDocument
      tags: [agreements]
      summary: Upload a draft's document
      description: |
        The agreement as a PDF, 10 MB at most, replacing any uploaded before. Its SHA-256 is
        kept with it, and checked whenever it is read back. Prospector doesn't read what it
        says, and it is not for deeds or anything that must be witnessed or notarised. A PDF
        that is password-protected, encrypted or already signed is refused, as Prospector
        couldn't fill it in and seal it. Fields on pages a replacement doesn't have go.
      parameters:
        - name: name
          in: query
          description: The file's name, to give it back by.
          schema: { type: string }
      security:
        - session: []
        - bearer: ["agreements:write"]
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The agreement with its document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getAgreementDocument
      tags: [agreements]
      summary: Download a draft's document
      description: Always as a download, never shown in the page.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The PDF, exactly as uploaded.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agreements/{id}/recipients:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listAgreementRecipients
      tags: [agreements]
      summary: Who an agreement goes to
      description: Its signers in their order, then those who get a copy once it is signed.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Signers first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgreementRecipient" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addAgreementRecipient
      tags: [agreements]
      summary: Add a signer, or someone who gets a copy, to a draft
      description: |
        One contact or one member. A contact must be a person at the agreement's company,
        picked, with a single email address, and not on the never-contact list. They go last
        in the order. Nothing is sent: that comes in a later release.
      security:
        - session: []
        - bearer: ["agreements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [signer, copy] }
                contact: { type: integer, format: int64, x-go-type-skip-optional-pointer: false }
                member: { type: integer, format: int64, x-go-type-skip-optional-pointer: false, description: "The member's user id." }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementRecipient" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agreements/{id}/recipients/{recipient}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
      - name: recipient
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: changeAgreementRecipient
      tags: [agreements]
      summary: Move a recipient in the order, or change what they get
      description: Making a signer someone who gets a copy removes the fields placed for them.
      security:
        - session: []
        - bearer: ["agreements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [signer, copy], x-go-type-skip-optional-pointer: false }
                position: { type: integer, minimum: 1, x-go-type-skip-optional-pointer: false, description: "Where in the order, from 1." }
      responses:
        "200":
          description: The recipient as they now are.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementRecipient" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeAgreementRecipient
      tags: [agreements]
      summary: Take a recipient off a draft, with their fields
      security:
        - session: []
        - bearer: ["agreements:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agreements/{id}/fields:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listAgreementFields
      tags: [agreements]
      summary: Where each signer fills in a draft
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: By page, then from the top.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgreementField" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putAgreementFields
      tags: [agreements]
      summary: Set every field on a draft at once
      description: |
        Replaces all of them. Each belongs to one of the agreement's signers and lies wholly
        on one of its pages, given as fractions of the page as shown, from its top left.
        200 at most.
      security:
        - session: []
        - bearer: ["agreements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/AgreementFieldIn" }
      responses:
        "200":
          description: The fields as kept.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgreementField" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/people:
    parameters:
      - $ref: "#/components/parameters/org"
    post:
      operationId: addPerson
      tags: [people]
      summary: Add a person straight to outreach
      description: For someone you found yourself. They go into the LinkedIn queue, or, marked `added`, straight on to the email that follows. The never-contact list applies.
      security:
        - session: []
        - bearer: ["contacts:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonNew" }
      responses:
        "201":
          description: The person, added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonAdded" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/people/draft:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: draftPerson
      tags: [people]
      summary: A person to add, read from a LinkedIn profile
      description: What the add form starts with when the bookmarklet opens it from someone's profile, and the bookmarklet itself. Nothing is saved; add them with `addPerson`.
      parameters:
        - name: url
          in: query
          description: The profile's address; anything after `?` is dropped.
          schema: { type: string }
        - name: name
          in: query
          description: The profile page's title, which leads with their name.
          schema: { type: string }
        - name: headline
          in: query
          description: Their headline, like `Head of Marketing at Larkmoor Yachts`, read for their role and company.
          schema: { type: string }
        - name: company
          in: query
          description: Their company, in place of the one the headline gives.
          schema: { type: string }
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The person as far as the profile says.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDraft" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeContact
      tags: [people]
      summary: Change a person's details, or where their conversation stands
      description: Send only what changes; they are saved together or not at all. An empty value clears a field. An email or profile on the never-contact list, or of someone erased on request, is refused.
      security:
        - session: []
        - bearer: ["contacts:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactChange" }
      responses:
        "204": { description: Changed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/contacts/{id}/pick:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: pickContact
      tags: [research]
      summary: Pick a suggested person for outreach
      description: Takes someone an agent suggested out of Research and into the LinkedIn queue.
      security:
        - session: []
        - bearer: ["research:review"]
      responses:
        "204": { description: Picked. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: reviewCompany
      tags: [research]
      summary: Qualify a company, reject it, or put it back for review
      description: A company rejected for the organisation's own offering is one agents are told not to suggest again; a verdict for another offering leaves the company's own stage as it was.
      security:
        - session: []
        - bearer: ["research:review"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyReview" }
      responses:
        "204": { description: Changed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/suggestions/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: decideSuggestion
      tags: [research]
      summary: Accept or dismiss a detail an agent found for someone already stored
      description: Accepting fills the detail in; one dismissed isn't raised again.
      security:
        - session: []
        - bearer: ["research:review"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, dismissed] }
      responses:
        "204": { description: Decided. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enrichers:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listEnrichers
      tags: [enrichment]
      summary: The organisation's enrichment vendors
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Every vendor, in the order they are asked.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Enricher" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveEnricher
      tags: [enrichment]
      summary: Add a vendor, or change the one of that kind
      description: |
        An empty `api_key` keeps the saved one. The key is sealed under the server's key and
        never shown again. Vendors are asked lowest `position` first, and each no more than
        `monthly_limit` times a calendar month (UTC); 0 stops it being asked.
      security:
        - session: []
        - bearer: ["settings:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnricherSettings" }
      responses:
        "200":
          description: The vendor as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enricher" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enrichers/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    delete:
      operationId: deleteEnricher
      tags: [enrichment]
      summary: Remove a vendor and its key
      security:
        - session: []
        - bearer: ["settings:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/contacts/{id}/enrich:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: enrichContact
      tags: [enrichment]
      summary: Ask the vendors for details someone lacks
      description: |
        For each field, the vendors that look for it are asked in order until one finds it,
        each lookup counting toward that vendor's month. What is found waits under Details to
        check for a person to accept, marked with the vendor that found it. A field they already
        have is not looked for, nor one a vendor was asked about in the last 30 days. Nobody on the never-contact
        list, at a domain on it, or who declined is looked up, and a find that belongs to
        someone erased or on the list is dropped.
      security:
        - session: []
        - bearer: ["enrich:spend"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  items: { type: string, enum: [email, phone, linkedin] }
                task: { type: integer, format: int64, description: "The task this is for, if any." }
      responses:
        "200":
          description: What came of each field.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/EnrichResult" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/settings:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: getSettings
      tags: [settings]
      summary: The organisation's settings
      description: As they are in effect, with defaults where none were saved.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: changeSettings
      tags: [settings]
      summary: Change the organisation's settings
      description: |
        Send only what changes; the rest stay as they are, and all are saved together or
        not at all. Agents connected now are given the new guidance, wording and
        never-contact list on their next call. For a member, only an owner.
      security:
        - session: []
        - bearer: ["settings:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsChange" }
      responses:
        "200":
          description: The settings as they now are.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Problem" }


  /o/{org}/api/v1/offerings:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listOfferings
      tags: [offerings]
      summary: What the organisation sells besides what its settings describe
      description: |
        The organisation's own offering, whose look-for list is in Settings and whose verdict on
        a company is the company's stage, isn't listed. Reviewing a company or starting a task
        names it as offering 0.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: By name.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Offering" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addOffering
      tags: [offerings]
      summary: Add something the organisation sells
      description: For a member, only an owner.
      security:
        - session: []
        - bearer: ["settings:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingNew" }
      responses:
        "201":
          description: The offering, added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offering" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/offerings/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    patch:
      operationId: changeOffering
      tags: [offerings]
      summary: Change an offering's name or wording
      description: Send only what changes. For a member, only an owner.
      security:
        - session: []
        - bearer: ["settings:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingChange" }
      responses:
        "200":
          description: The offering as it now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offering" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeOffering
      tags: [offerings]
      summary: Remove an offering, with every verdict made for it
      description: The history keeps what was decided. For a member, only an owner.
      security:
        - session: []
        - bearer: ["settings:write"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/offerings/{id}/verdicts:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listVerdicts
      tags: [offerings]
      summary: Where companies stand for an offering
      description: |
        Rejected ones included, with who decided, when and why, so one ruled out by mistake
        can be found and put back for review.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: stage
          in: query
          description: Only those at this stage.
          schema: { type: string, enum: [review, qualified, rejected] }
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The latest decided first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Verdict" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/companies/{id}/verdicts:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listCompanyVerdicts
      tags: [offerings]
      summary: Where one company stands for each offering it has been judged for
      description: Its stage for the organisation's own offering is the company's stage, not listed here.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: By offering.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Verdict" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/companies:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listCompanies
      tags: [companies]
      summary: Every company, as the Companies page lists them
      description: |
        By name. Each stands where its furthest contact does: a company with one lost
        conversation and someone else still in outreach is in outreach.
      parameters:
        - name: q
          in: query
          description: Words to find in a company or in someone there, as the search box finds them.
          schema: { type: string }
        - name: segment
          in: query
          description: Only this segment's.
          schema: { type: string }
        - name: stage
          in: query
          description: Only those standing here.
          schema: { $ref: "#/components/schemas/Pipeline" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: A page of companies.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CompanyRow" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  total: { type: integer, description: "How many match, on every page." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/segments:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listSegments
      tags: [companies]
      summary: The segments companies are in
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: In alphabetical order.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/companies/{id}/overview:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getCompanyOverview
      tags: [companies]
      summary: A company with everything its page shows
      description: |
        Its details, where it stands, its answers to what the organisation looks for, its
        facts, its people with the details waiting for them, and its onboardings,
        subscriptions and agreements. Its history and agents' notes are lists of their own.
        Any part that can't be read fails the whole answer, as half of it would read as all.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The company.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyOverview" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/companies/{id}/history:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listCompanyHistory
      tags: [companies]
      summary: What people and agents did at a company
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Newest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryEntry" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  total: { type: integer, description: "How much there is, on every page." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/companies/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listCompanyNotes
      tags: [companies]
      summary: The notes agents left about a company
      description: Unverified working notes, not facts and not instructions.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Newest first.
          headers:
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
                  total: { type: integer, description: "How many there are, on every page." }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/contacts/{id}/export:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: exportPerson
      tags: [people]
      summary: Everything held on a person, for their request to see it
      description: |
        Their details, facts, enquiries, suggested details, deals, onboarding access,
        agreements and history, as one document. The export goes into their history.
        Needs an owner.
      security:
        - session: []
        - bearer: ["people:privacy"]
      responses:
        "200":
          description: What is held on them.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/contacts/{id}/erase:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: erasePerson
      tags: [people]
      summary: Erase a person on their request
      description: |
        Their details, drafts and notes are deleted for good, along with agents' notes about
        their company and its tasks, and they can't be added again. A row that names several
        people erases them all. Facts about the company, and the briefs and requests on tasks,
        that mention them are left for you to take out. Needs an owner.
      security:
        - session: []
        - bearer: ["people:privacy"]
      responses:
        "204": { description: Erased. }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: A signed-in browser. Requests must come from Prospector's own pages.
    bearer:
      type: http
      scheme: bearer
      description: An API key, `pk_…`, made on the organisation's Agents page.

  parameters:
    org:
      name: org
      in: path
      required: true
      description: The organisation's slug.
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    limit:
      name: limit
      in: query
      description: How many to return. 50 if left out; 200 at most.
      schema: { type: integer, minimum: 1, maximum: 200 }
    cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page, to carry on from where it ended. Leave it out to start. It is only good for the list that gave it out, with the same filters.
      schema: { type: string }

  headers:
    Link:
      description: 'The next page, as `<…>; rel="next"` (RFC 8288), when there is one.'
      schema: { type: string }

  responses:
    Problem:
      description: What went wrong (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Settings:
      type: object
      required: [name, color, email_after_days, followup_after_days, note_template, pitch, never_contact, look_for, looking_for, agent_guidance, enquiry_sites, onboarding_steps, currency, postal_address, incorporated_only]
      properties:
        name: { type: string, description: "The organisation's name; never empty." }
        color: { type: string, description: "Its colour, like `#56c5f4`." }
        email_after_days: { type: integer, format: int32, description: "Days without a LinkedIn accept before the email is due, up to 60; 0 is the default, 2." }
        followup_after_days: { type: integer, format: int32, description: "Days without a reply before the follow-up is due, up to 60; 0 is the default, 6." }
        note_template: { type: string, description: "The connection note. `{first}`, `{company}` and `{org}` are filled in." }
        pitch: { type: string, description: "The call script's pitch line. `{company}` is filled in." }
        never_contact: { type: string, description: "Domains, email addresses and LinkedIn profiles never to contact, one per line." }
        look_for: { type: string, description: "What makes a company a fit, one `name: what counts` per line." }
        looking_for:
          type: array
          items: { $ref: "#/components/schemas/LookFor" }
          readOnly: true
          description: "`look_for` read: each thing in order, with its hint and whether it is a must (`(must)` after its name)."
        agent_guidance: { type: string, description: "Sent to every agent when it connects." }
        enquiry_sites: { type: string, description: "Sites whose forms may post enquiries, one address per line, like `https://www.example.com`. Empty takes none." }
        onboarding_steps: { type: string, description: "What a new customer goes through, one step a line." }
        currency: { type: string, description: "The three-letter code deals are valued in." }
        postal_address: { type: string, description: "Where the organisation can be written to; 300 characters at most." }
        incorporated_only: { type: boolean, description: "Email only incorporated companies." }

    SettingsChange:
      type: object
      properties:
        name: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "The organisation's name; never empty." }
        color: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Its colour, like `#56c5f4`." }
        email_after_days: { type: integer, format: int32, nullable: true, x-go-type-skip-optional-pointer: false, description: "Days without a LinkedIn accept before the email is due, up to 60; 0 is the default, 2." }
        followup_after_days: { type: integer, format: int32, nullable: true, x-go-type-skip-optional-pointer: false, description: "Days without a reply before the follow-up is due, up to 60; 0 is the default, 6." }
        note_template: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "The connection note. `{first}`, `{company}` and `{org}` are filled in." }
        pitch: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "The call script's pitch line. `{company}` is filled in." }
        never_contact: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Domains, email addresses and LinkedIn profiles never to contact, one per line." }
        look_for: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "What makes a company a fit, one `name: what counts` per line." }
        agent_guidance: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Sent to every agent when it connects." }
        enquiry_sites: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Sites whose forms may post enquiries, one address per line, like `https://www.example.com`. Empty takes none." }
        onboarding_steps: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "What a new customer goes through, one step a line." }
        currency: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "The three-letter code deals are valued in." }
        postal_address: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Where the organisation can be written to; 300 characters at most." }
        incorporated_only: { type: boolean, nullable: true, x-go-type-skip-optional-pointer: false, description: "Email only incorporated companies." }

    Offering:
      type: object
      required: [id, name, look_for, pitch, note_template, updated_by, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        look_for: { type: string, description: "What makes a company a fit for it, one `name: what counts` per line. Agents working a task for it are given this in place of the organisation's own list." }
        pitch: { type: string, description: "Its pitch line, kept for when people are reached for it; nothing uses it yet." }
        note_template: { type: string, description: "Its connection note, kept for when people are picked for it; nothing uses it yet." }
        updated_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OfferingNew:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        look_for: { type: string }
        pitch: { type: string }
        note_template: { type: string }

    OfferingChange:
      type: object
      properties:
        name: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, maxLength: 60 }
        look_for: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        pitch: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        note_template: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }

    Verdict:
      type: object
      required: [offering_id, company_id, company, stage, fit, reason, by, updated_at]
      properties:
        offering_id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        company: { type: string, description: "The company's name." }
        stage: { type: string, enum: [review, qualified, rejected] }
        fit: { type: string }
        reason: { type: string, description: "Why, as whoever decided said it." }
        by: { type: string, description: "Who decided." }
        updated_at: { type: string, format: date-time }

    ContactChange:
      type: object
      properties:
        person: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Their name." }
        title: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        email: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        linkedin: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Their profile's address." }
        phone: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Setting it also guesses their time zone." }
        tz: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Their time zone, as an IANA name." }
        sources: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        call_notes: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        send_to: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        message: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        note: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        subject: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        body: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        followup: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        stage: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "Where their conversation stands on the board." }
        next_step: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        next_date: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "YYYY-MM-DD, or empty for none." }
        lost_reason: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }

    CompanyReview:
      type: object
      required: [stage]
      properties:
        stage: { type: string, enum: [review, qualified, rejected] }
        fit: { type: string, description: "Why, in a few words; kept with the company, or with the verdict when an offering is named. Empty leaves it as it was." }
        offering: { type: integer, format: int64, description: "The offering this is a verdict for; 0 or left out is the organisation's own, which is the company's stage." }
        reason: { type: string, description: "Why, kept with a verdict for an offering; refused for the organisation's own." }

    PersonNew:
      type: object
      required: [name]
      properties:
        name: { type: string }
        linkedin: { type: string, description: "Their profile's address." }
        title: { type: string }
        company: { type: string, description: "The company's name; one not yet stored is added." }
        email: { type: string }
        note: { type: string, description: "The note to send them with the connection request." }
        added: { type: boolean, description: "Already connected on LinkedIn: their email comes up next." }

    PersonDraft:
      type: object
      required: [linkedin, name, title, company, bookmarklet]
      properties:
        linkedin: { type: string, description: "Their profile's address." }
        name: { type: string }
        title: { type: string }
        company: { type: string }
        bookmarklet: { type: string, description: "A `javascript:` link to keep in the bookmarks bar: clicked on a LinkedIn profile, it opens the add form filled in from it." }

    PersonAdded:
      type: object
      required: [id, name, message]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        message: { type: string, description: "Where they went, for a person." }

    TaskCounts:
      type: object
      required: [companies, people]
      properties:
        companies: { type: integer }
        people: { type: integer }

    Asked:
      type: object
      required: [id, text, asked_by, asked_at, done, added_since]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        asked_by: { type: string }
        asked_at: { type: string, format: date-time }
        done: { type: boolean }
        done_by: { type: string }
        added_since: { $ref: "#/components/schemas/TaskCounts" }
        held_by: { type: string, description: The agent working this open request now. }
        held_until: { type: string, format: date-time, x-go-type-skip-optional-pointer: false, description: "When that agent's claim lapses unless it keeps adding things for the task." }
        yours: { type: boolean, description: The calling key holds this request. }

    TaskBrief:
      type: object
      required: [id, title, status, open_requests, found]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string, description: "`waiting` (nobody is on it), `working` (an agent changed something in the last half hour, or holds an open request), `done` or `closed`." }
        open_requests:
          type: array
          items: { $ref: "#/components/schemas/Asked" }
        found: { $ref: "#/components/schemas/TaskCounts" }
        last_agent: { type: string }
        last_agent_at: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        last_agent_action: { type: string, description: "What that agent last did: `task:pickup` when it only picked the task up." }
        last_agent_was_you: { type: boolean }

    TaskCompany:
      type: object
      required: [id, name, stage, since]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        stage: { type: string, description: "`review`, `qualified` or `rejected`: a rejected company is not to be suggested again." }
        since: { type: string, format: date-time }

    TaskPerson:
      type: object
      required: [id, name, company, stage, since]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        title: { type: string }
        company: { type: string }
        stage: { type: string }
        since: { type: string, format: date-time }

    TaskNoteOut:
      type: object
      required: [id, kind, text, actor, at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        text: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
        company: { type: string }
        company_id: { type: integer, format: int64, description: "The company it is about, if any." }
        by_you: { type: boolean }

    TaskOut:
      allOf:
        - $ref: "#/components/schemas/TaskBrief"
        - type: object
          required: [brief, requests, companies, people, notes]
          properties:
            brief: { type: string, description: "What the person asked for, in their words." }
            requests:
              type: array
              description: "Everything asked on this task, oldest first; the first is the brief."
              items: { $ref: "#/components/schemas/Asked" }
            companies:
              type: array
              items: { $ref: "#/components/schemas/TaskCompany" }
            people:
              type: array
              items: { $ref: "#/components/schemas/TaskPerson" }
            notes:
              type: array
              items: { $ref: "#/components/schemas/TaskNoteOut" }
            claimed_request: { type: integer, format: int64, description: "The open request kept for the calling key to work. Absent when it claims nothing." }
            next_cursor: { type: string, description: "Set when companies, people or notes hold more than is listed." }

    TaskWork:
      type: object
      required: [actor, start, end, going, changes, companies, people, drafts]
      properties:
        actor: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: Its latest change. }
        going: { type: boolean, description: Its agent changed something in the last half hour. }
        changes: { type: integer }
        companies: { type: integer, description: Companies it changed. }
        people: { type: integer, description: People it suggested. }
        drafts: { type: integer }

    NoteNew:
      type: object
      required: [kind, text]
      properties:
        task: { type: integer, format: int64, description: "The task this is about, if any." }
        company: { type: string, description: "The company's id or exact name, if it is about one." }
        kind: { type: string, description: "`skipped` (looked and passed over, say why), `dead_end` (searched and found nothing) or `next` (what you would do next)." }
        text: { type: string, maxLength: 500, description: "One or two sentences. Name no people: suggest them as contacts instead." }

    Note:
      type: object
      required: [id, actor, kind, text, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        actor: { type: string }
        kind: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }

    TaskNew:
      type: object
      required: [title, brief]
      properties:
        title: { type: string, description: "A few words naming the task. Empty, it takes the brief's first line; longer than 60 characters, it is cut." }
        brief: { type: string, maxLength: 4000, description: "What is wanted: the task's first request." }
        offering: { type: integer, format: int64, description: "What the task finds companies for: agents are given its look-for fields, and what they find waits in its review. 0 or left out is the organisation's own." }
        agents:
          type: array
          items: { type: integer, format: int64 }
          description: Prospector's own agents to start on the task, each on its own request.

    ResearchCompany:
      type: object
      required: [id, name, domain, country, segment, stage, grade, why, found_by, created_at, criteria, fit, facts, people]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        domain: { type: string }
        country: { type: string }
        segment: { type: string }
        stage: { type: string, enum: [review, qualified, rejected] }
        grade: { type: string, description: "The fit grade a person or agent gave, A, B or C; empty for none." }
        found_by: { type: string }
        created_at: { type: string, format: date-time }
        criteria:
          type: array
          items: { $ref: "#/components/schemas/Criterion" }
          description: Each thing the organisation looks for, in its order, with the latest answer.
        fit: { $ref: "#/components/schemas/Fit" }
        why: { type: string, description: "Why it fits, in the words of whoever added it; empty for none." }
        facts:
          type: array
          items: { $ref: "#/components/schemas/ResearchFact" }
          description: The facts besides the answers, older answers among them, oldest first.
        people:
          type: array
          items: { $ref: "#/components/schemas/ResearchPerson" }

    LookFor:
      type: object
      required: [field, hint, must]
      properties:
        field: { type: string }
        hint: { type: string }
        must: { type: boolean }

    ResearchFact:
      type: object
      required: [id, field, value, source_url, answer, inferred, by, at]
      properties:
        id: { type: integer, format: int64 }
        field: { type: string }
        value: { type: string }
        source_url: { type: string }
        answer: { type: string, enum: [yes, "no", unknown] }
        inferred: { type: boolean }
        by: { type: string }
        at: { type: string, format: date-time }

    ResearchPerson:
      type: object
      required: [id, name, title, status, email_status, linkedin, source_url, pending]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        title: { type: string }
        status: { type: string, description: "`suggested` until someone picks them." }
        email_status: { type: string, description: "`verified`, `guess`, or empty." }
        linkedin: { type: string }
        source_url: { type: string, description: The first page that shows them. }
        pending:
          type: array
          items: { $ref: "#/components/schemas/PendingDetail" }
          description: New details an agent found for them, waiting to be accepted.

    PendingDetail:
      type: object
      required: [id, field, value, current, source_url, by, at, email_status]
      properties:
        id: { type: integer, format: int64, description: "The suggestion: decide it at /api/v1/suggestions/{id}." }
        field: { type: string }
        value: { type: string }
        current: { type: string, description: What the person holds now; empty for nothing. }
        source_url: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
        email_status: { type: string, description: "For an email, `guess` when it was worked out from the company's pattern rather than seen; otherwise empty." }

    Pipeline:
      type: string
      enum: [research, outreach, replied, meeting, proposal, won, lost, rejected]
      description: "Where a company stands, from its furthest contact: `research` until anyone there is reached, `rejected` for one turned down before then."

    CompanyRow:
      type: object
      required: [id, name, country, segment, grade, people, pipeline]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        country: { type: string }
        segment: { type: string }
        grade: { type: string, description: "The fit grade a person or agent gave, A, B or C; empty for none." }
        people: { type: integer, description: How many people are held there. }
        pipeline: { $ref: "#/components/schemas/Pipeline" }

    CompanyOverview:
      type: object
      required: [id, name, domain, country, segment, grade, why, stage, found_by, created_at, pipeline, touches, looking_for, facts, people, onboardings, planned_steps, subscriptions, agreements]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        domain: { type: string }
        country: { type: string }
        segment: { type: string }
        grade: { type: string, description: "The fit grade a person or agent gave, A, B or C; empty for none." }
        why: { type: string, description: "Why it fits, in the words of whoever added it; empty for none." }
        stage: { type: string, enum: [review, qualified, rejected] }
        found_by: { type: string }
        created_at: { type: string, format: date-time }
        pipeline: { $ref: "#/components/schemas/Pipeline" }
        touches: { type: integer, description: "How many times anyone there was reached out to: added on LinkedIn, emailed, followed up or called." }
        looking_for:
          type: array
          items: { $ref: "#/components/schemas/Criterion" }
          description: Each thing the organisation looks for, in its order, with the latest answer.
        facts:
          type: array
          items: { $ref: "#/components/schemas/ResearchFact" }
          description: Every fact, answers included, oldest first.
        people:
          type: array
          items: { $ref: "#/components/schemas/CompanyPerson" }
        onboardings:
          type: array
          items: { $ref: "#/components/schemas/Onboarding" }
        planned_steps: { type: integer, description: "How many steps the organisation's onboarding has; none, and no onboarding can be started." }
        subscriptions:
          type: array
          items: { $ref: "#/components/schemas/Subscription" }
        agreements:
          type: array
          items: { $ref: "#/components/schemas/Agreement" }

    CompanyPerson:
      type: object
      required: [id, name, title, linkedin, stage, several, pending]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        title: { type: string }
        linkedin: { type: string }
        stage: { type: string, description: "Where they stand, as the page says it: suggested, not contacted, in outreach, hold, declined, or their conversation's stage." }
        several: { type: string, description: "The row's whole name when it names several people, all of whom erasing it erases; empty for one person." }
        pending:
          type: array
          items: { $ref: "#/components/schemas/PendingDetail" }
          description: New details an agent found for them, waiting to be accepted.

    HistoryEntry:
      type: object
      required: [at, actor, action, value, person, text]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        value: { type: string }
        person: { type: string, description: Who at the company it was about; empty for the company itself. }
        text: { type: string, description: "What happened, as the page says it." }

    Criterion:
      type: object
      required: [field, must, state]
      properties:
        field: { type: string }
        must: { type: boolean }
        state: { type: string, enum: [met, not_met, not_found, unchecked] }
        value: { type: string, description: "The answer in a sentence; for not_found, where the agent looked." }
        source_url: { type: string }
        inferred: { type: boolean, description: "Read from a job advert, a third party or an old page." }
        by: { type: string }
        at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false, description: "When the answer was given; null when unchecked." }

    Fit:
      type: object
      required: [of, met, not_found, unchecked, musts_missed, text]
      properties:
        of: { type: integer }
        met: { type: integer }
        not_found: { type: integer }
        unchecked: { type: integer }
        musts_missed: { type: integer }
        text: { type: string, description: "As the page says it, such as \"3 of 4 · 1 not found\"." }

    TaskStarted:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [runs, not_started]
          properties:
            runs:
              type: array
              items: { $ref: "#/components/schemas/Run" }
            not_started:
              type: array
              items: { type: string }
              description: For each agent named that couldn't start, why.

    TaskChange:
      type: object
      required: [closed]
      properties:
        closed: { type: boolean }

    Task:
      type: object
      required: [id, title, created_by, created_at, closed_at, offering_id]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        offering_id: { type: integer, format: int64, description: "What the task finds companies for; 0 is the organisation's own." }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }

    TaskRequest:
      type: object
      required: [id, task_id, text, asked_by, asked_at, done_at, done_by]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        text: { type: string }
        asked_by: { type: string }
        asked_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        done_by: { type: string }

    NextCursor:
      type: string
      description: There is more. Pass this back as `cursor` for the next page; it is left out on the last one.
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    AgentKind:
      type: string
      enum: [openai, anthropic]
      description: "`openai` is any OpenAI-compatible endpoint; `anthropic` is Claude through Anthropic's own API."

    AgentSettings:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 40 }
        kind:
          type: string
          description: "`openai` or `anthropic`; empty keeps an existing agent's kind, and is `openai` for a new one."
        base_url:
          type: string
          description: The endpoint. Required for `openai`; for `anthropic`, empty is Anthropic's own.
        api_key:
          type: string
          writeOnly: true
          description: Sealed when saved and never returned. Empty keeps the saved key.
        model: { type: string, maxLength: 200 }
        tools_url: { type: string, description: An MCP server whose tools the agent may use. }
        search_url:
          type: string
          description: A SearXNG instance, with `json` among its `search.formats`, that the built-in `web_search` asks. Empty, the agent has no search of its own; it can still read pages with `fetch_page`.
        tools:
          type: array
          items: { type: string }
          description: The tools it may use, from those the tool server lists.
        fallback:
          type: integer
          format: int64
          description: The agent that takes its task over when its endpoint stays limited or away; 0 for none.
        fallback_minutes:
          type: integer
          description: How long it waits before falling back, 1 to 10080; 0 is 15.
        thinking_off:
          type: boolean
          description: For `openai`, asks the model not to think before it answers (`chat_template_kwargs.enable_thinking` false, which llama.cpp and vLLM honour), for a local thinking model too slow to think at every step. Ignored for `anthropic`.

    Agent:
      type: object
      required: [id, name, kind, base_url, model, tools_url, search_url, models, tools, allowed_tools, fallback, fallback_minutes, thinking_off, problem, checked_at, has_key, ready, updated_by, updated_at, state, searches, search_text, tools_text, fallback_text]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AgentKind" }
        base_url: { type: string }
        model: { type: string }
        tools_url: { type: string }
        search_url: { type: string }
        models:
          type: array
          items: { type: string }
          description: The models the endpoint listed when last checked.
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
          description: The tools the tool server listed when last checked.
        allowed_tools:
          type: array
          items: { type: string }
        fallback: { type: integer, format: int64 }
        fallback_minutes: { type: integer }
        thinking_off: { type: boolean }
        problem: { type: string, description: "What the last check found wrong, if anything." }
        checked_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        has_key: { type: boolean }
        ready: { type: boolean, description: Whether it has what it needs to be run. }
        state: { $ref: "#/components/schemas/AgentState" }
        searches: { type: boolean, description: "Whether it can look things up on the web, through SearXNG or a tool it is allowed." }
        search_text: { type: string, description: "How it searches, as its card says: `✓ SearXNG`, `✓ through its tools` or `none`." }
        tools_text: { type: string, description: "Its tools, as its card says, such as `3 of 12 allowed`." }
        fallback_text: { type: string, description: "Who takes its task over and when, as its card says, such as `Local, after 15 minutes`." }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }

    AgentState:
      type: object
      required: [rail, line, todo]
      description: How the agent's card looks on the Agents page.
      properties:
        rail: { type: string, enum: [ok, warn, stop], description: "`ok` ready; `warn` runs, missing something; `stop` can't run." }
        line: { type: string, description: "A line saying so, such as \"✓ Ready · checked 2 Jan 15:04\"." }
        todo: { type: string, description: "What to do about it; empty when nothing." }

    Connect:
      type: object
      required: [base_url, mcp_url, can_keep_keys, scopes, tools, kinds]
      properties:
        base_url: { type: string, description: "The organisation's address, ending in a slash, that its API paths follow." }
        mcp_url: { type: string, description: The MCP endpoint an outside agent connects to with a key. }
        can_keep_keys: { type: boolean, description: "Whether this server has a secret key to seal an agent's API key with; without one, no agent of Prospector's own can be saved." }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
          description: Every scope a key can be given.
        tools:
          type: array
          items: { $ref: "#/components/schemas/AgentToolScope" }
          description: The tools an agent gets over MCP, and the scope each needs.
        kinds:
          type: array
          items: { $ref: "#/components/schemas/AgentKindLabel" }

    AgentKindLabel:
      type: object
      required: [kind, label]
      properties:
        kind: { $ref: "#/components/schemas/AgentKind" }
        label: { type: string }

    Scope:
      type: object
      required: [name, what]
      properties:
        name: { type: string }
        what: { type: string, description: What a key with it may do. }

    AgentToolScope:
      type: object
      required: [name, scope, what]
      properties:
        name: { type: string }
        scope: { type: string }
        what: { type: string }

    APIKey:
      type: object
      required: [id, name, prefix, scopes, created_by, created_at, last_used_at, builtin]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: "The secret's first characters, to tell keys apart." }
        scopes:
          type: array
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        builtin: { type: boolean, description: "One of Prospector's own agents' keys, which changes on the agent." }

    KeyNew:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { type: string }

    KeyMade:
      type: object
      required: [key, secret, message]
      properties:
        key: { $ref: "#/components/schemas/APIKey" }
        secret: { type: string, description: "The key itself, `pk_…`, shown this once." }
        message: { type: string, description: "A sentence for a person, with the secret in it." }

    KeyChanged:
      type: object
      required: [key, message]
      properties:
        key: { $ref: "#/components/schemas/APIKey" }
        message: { type: string, description: "A sentence saying how the change went, for a person." }

    AgentScore:
      type: object
      required: [agent, companies, qualified, rejected, contacts, picked, replied, text]
      properties:
        agent: { type: string }
        companies: { type: integer, description: Companies it suggested. }
        qualified: { type: integer }
        rejected: { type: integer }
        contacts: { type: integer, description: Contacts it suggested. }
        picked: { type: integer, description: "Of its contacts, those picked for outreach." }
        replied: { type: integer, description: "Of its contacts, those who replied." }
        text: { type: string, description: "As the page says it, such as \"Companies: 4 suggested, 2 qualified (50%), 1 rejected\"." }

    AgentWork:
      type: object
      required: [actor, start, end, going, changes, companies, people, drafts, tasks, text]
      properties:
        actor: { type: string, description: "Whose work, `agent:` and its name." }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: Its last change. }
        going: { type: boolean, description: Whether it may still be at it. }
        changes: { type: integer }
        companies: { type: integer }
        people: { type: integer, description: People it suggested. }
        drafts: { type: integer }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskTitle" }
        text: { type: string, description: "As the page says it, such as \"2 Jan 15:04, 12 min · 5 changes at 2 companies, 3 people suggested\"." }

    TaskTitle:
      type: object
      required: [id, title]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }

    AgentEvent:
      type: object
      required: [at, actor, action, value, text]
      properties:
        at: { type: string, format: date-time }
        actor: { type: string, description: The agent's name. }
        action: { type: string }
        value: { type: string }
        text: { type: string, description: "As the page says it, such as \"added a fact: employees: 40\"." }

    AgentSaved:
      type: object
      required: [agent, message]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        message: { type: string, description: "A sentence saying how the save went, for a person." }

    Tool:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    EnricherKind:
      type: string
      enum: [hunter]
      description: "The vendors Prospector can ask. `hunter` is Hunter.io, which finds work emails."

    EnricherSettings:
      type: object
      required: [kind, monthly_limit]
      properties:
        kind: { $ref: "#/components/schemas/EnricherKind" }
        api_key: { type: string, description: "The vendor's key for your account; empty keeps the saved one." }
        position: { type: integer, description: "Lower is asked first." }
        monthly_limit: { type: integer, minimum: 0, maximum: 100000, description: "Lookups a calendar month, at most." }

    Enricher:
      type: object
      required: [id, kind, position, monthly_limit, used_this_month, fields, has_key, updated_by, updated_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/EnricherKind" }
        position: { type: integer }
        monthly_limit: { type: integer }
        used_this_month: { type: integer }
        fields:
          type: array
          items: { type: string }
          description: Which of email, phone and linkedin it looks for.
        has_key: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }

    EnrichResult:
      type: object
      required: [field, outcome]
      properties:
        field: { type: string }
        vendor: { type: string, description: "The vendor whose answer this is." }
        outcome:
          type: string
          enum: [suggested, none, has, skipped, failed]
          description: "`suggested` waits for a person to accept; `none` is that no vendor found it; `has` that they have one already, or it was suggested before; `skipped` that no vendor could be asked or the find may not be kept; `failed` that a vendor couldn't be reached."
        detail: { type: string }

    RunStatus:
      type: string
      enum: [running, waiting, finished, stopped, failed]

    Run:
      type: object
      required: [id, task, agent, agent_name, request, started_by, model, status, stop_asked, started_at, ended_at, wait_until, turns, episodes, tool_calls, added, resumes, tokens_in, tokens_out, stop_reason]
      properties:
        id: { type: integer, format: int64 }
        task: { type: integer, format: int64 }
        agent: { type: integer, format: int64 }
        agent_name: { type: string }
        request: { type: integer, format: int64, description: "The request it is working, 0 before it has one." }
        started_by: { type: string }
        model: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        stop_asked: { type: boolean }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        wait_until: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false, description: When a waiting run asks its endpoint again. }
        turns: { type: integer }
        episodes: { type: integer }
        tool_calls: { type: integer }
        added: { type: integer, description: What it added to Research. }
        resumes: { type: integer }
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        stop_reason: { type: string }

    EnquiryText:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 10000 }

    EnquiryMessage:
      type: object
      required: [id, enquiry_id, ours, text, by, sent_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        enquiry_id: { type: integer, format: int64 }
        ours: { type: boolean, description: "True for a reply sent from here, false for what they said back." }
        text: { type: string }
        by: { type: string, description: "Who sent the reply, or recorded their answer." }
        sent_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false, description: When a reply of ours left. }
        created_at: { type: string, format: date-time }

    OnboardingStart:
      type: object
      required: [company]
      properties:
        company: { type: integer, format: int64 }
        name: { type: string, maxLength: 200, description: "Which one, when a company has several: a site, a product." }
        start: { type: string, description: "The day steps are dated from, YYYY-MM-DD; empty is today." }

    Onboarding:
      type: object
      required: [id, company_id, company, name, start, created_at, steps, done, late, live_on, invites, invitable, can_invite]
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        company: { type: string }
        name: { type: string }
        start: { type: string, description: "YYYY-MM-DD." }
        created_at: { type: string, format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStep" }
        done: { type: integer, description: How many steps are done. }
        late: { type: integer, description: How many are past their date and not done. }
        live_on: { type: string, description: "The day the last step was done, once every step is; empty until then." }
        invites:
          type: array
          items: { $ref: "#/components/schemas/OnboardingInvite" }
          description: Who at the company has been let see their steps.
        invitable:
          type: array
          items: { $ref: "#/components/schemas/Invitable" }
          description: People at the company with an email address here, who could be invited.
        can_invite: { type: boolean, description: "Whether a link can be emailed at all: the organisation has a mail server and the server knows its public address." }

    SubscriptionPerson:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    Invitable:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }

    OnboardingStep:
      type: object
      required: [id, onboarding_id, seq, name, who, due, done_on, done_by]
      properties:
        id: { type: integer, format: int64 }
        onboarding_id: { type: integer, format: int64 }
        seq: { type: integer }
        name: { type: string }
        who: { type: string, enum: [them, us], description: "Whose it is to do: the customer's or the organisation's." }
        due: { type: string, description: "YYYY-MM-DD, or empty for no date." }
        done_on: { type: string, description: "YYYY-MM-DD, or empty while it isn't done." }
        done_by: { type: string, description: "Who marked it; `customer` when they did from their own page." }

    OnboardingStepChange:
      type: object
      properties:
        done: { type: boolean, nullable: true, x-go-type-skip-optional-pointer: false }
        due: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "YYYY-MM-DD, or empty for no date." }

    OnboardingInvite:
      type: object
      required: [id, contact_id, name, email, invited_by, created_at, withdrawn]
      properties:
        id: { type: integer, format: int64 }
        contact_id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        invited_by: { type: string }
        created_at: { type: string, format: date-time }
        withdrawn: { type: boolean }

    SubscriptionNew:
      type: object
      required: [company, name, start]
      properties:
        company: { type: integer, format: int64 }
        name: { type: string, description: "What they are on, in your words." }
        amount: { type: string, description: "The price for one period as you would write it: `14,000`, `€5,000`. Empty for none." }
        per: { type: string, description: "`year` or `month`; empty is `year`." }
        start: { type: string, description: "YYYY-MM-DD." }
        term_months: { type: integer, description: "Months committed for; 0 is no commitment." }
        then: { type: string, description: "What happens when the term is up: `renews` for the same term, `rolls` on a period at a time, or `ends`; empty is `renews`. With no months committed it is always `rolls`, whatever is sent." }
        notice_days: { type: integer, description: Days of notice needed to stop it renewing. }

    SubscriptionChange:
      type: object
      properties:
        name: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        amount: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        per: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        start: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        term_months: { type: integer, nullable: true, x-go-type-skip-optional-pointer: false }
        then: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        notice_days: { type: integer, nullable: true, x-go-type-skip-optional-pointer: false }
        notice_on: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "The day notice was given, YYYY-MM-DD; empty to take it back." }
        ended_on: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "The day it stopped, YYYY-MM-DD; empty to take it back." }

    Subscription:
      type: object
      required: [id, company_id, company, name, amount, currency, per, start, term_months, then, notice_days, notice_on, ended_on, status, term_end, cancel_by, cancel_ends, ends, renewing, figure, soon, people, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        company: { type: string }
        name: { type: string }
        amount: { type: integer, format: int64, description: "The price for one period, in the currency's hundredths." }
        currency: { type: string }
        per: { type: string }
        start: { type: string }
        term_months: { type: integer }
        then: { type: string }
        notice_days: { type: integer }
        notice_on: { type: string, description: Empty when no notice has been given. }
        ended_on: { type: string, description: Empty unless an end was recorded. }
        status: { type: string, enum: [scheduled, active, notice given, ending, ended], description: Where it stands today. }
        term_end: { type: string, description: "The last day of the term in hand, or of its first term when it has yet to start." }
        cancel_by: { type: string, description: "The next day by which notice can still be given; empty when it ends anyway or notice was given." }
        cancel_ends: { type: string, description: The last day of the term that notice by `cancel_by` would end it at. }
        ends: { type: string, description: "The last day, once that is settled." }
        renewing: { type: boolean, description: Whether a renewal deal for it is open. }
        figure: { type: string, description: "The price for one period as written, such as £14,000; empty when there is none." }
        soon: { type: boolean, description: "Whether a day to cancel by, a renewal or an end falls within the next 30 days. One that turns over every month counts only once it has a day it stops." }
        people:
          type: array
          items: { $ref: "#/components/schemas/SubscriptionPerson" }
          description: Those at the company already in conversation, who a renewal can be with.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Deal:
      type: object
      required: [id, contact_id, person, company_id, seq, kind, stage, next_step, next_date, lost_reason, amount, currency, value, close_date, owner, subscription_id]
      properties:
        id: { type: integer, format: int64, description: "0 for a conversation's own deal that nothing has been set on yet." }
        contact_id: { type: integer, format: int64 }
        person: { type: string }
        company_id: { type: integer, format: int64, description: "0 when they have no company here." }
        seq: { type: integer, description: "0 for the conversation's own deal." }
        kind: { type: string }
        stage: { type: string, description: "`replied`, `meeting`, `proposal`, `won` or `lost`." }
        next_step: { type: string }
        next_date: { type: string, description: "YYYY-MM-DD, or empty." }
        lost_reason: { type: string }
        amount: { type: integer, format: int64, description: "In the currency's hundredths." }
        currency: { type: string }
        value: { type: string, description: "The amount as written, such as £14,000; empty when there is none." }
        close_date: { type: string, description: "YYYY-MM-DD, or empty." }
        owner: { type: string }
        subscription_id: { type: integer, format: int64, description: "The subscription a renewal is for; 0 for none." }

    DealCard:
      allOf:
        - $ref: "#/components/schemas/Deal"
        - type: object
          required: [company, call_notes, onboarding]
          properties:
            company: { type: string, description: "The name of the company the deal is with; empty when they have none here." }
            call_notes: { type: string, description: "The notes from calls with the person." }
            onboarding: { type: string, description: "`running` while the company is being onboarded, `live` once it is, empty when no onboarding has started." }

    MemberName:
      type: object
      required: [name]
      properties:
        name: { type: string }

    DealChange:
      type: object
      properties:
        kind: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        amount: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "As you would write it: `14,000`, `€5,000`; empty for none." }
        close_date: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        owner: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "A member's name, or empty for nobody." }
        stage: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: Only for a deal after the conversation's own. }
        next_step: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: Only for a deal after the conversation's own. }
        next_date: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: Only for a deal after the conversation's own. }
        lost_reason: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: Only for a deal after the conversation's own. }

    Enquiry:
      type: object
      required: [id, kind, name, email, company, phone, message, site, page, via, spam, contact_id, company_id, created_at, state, owner, note, company_name, in_conversation, thread]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        name: { type: string }
        email: { type: string }
        company: { type: string }
        phone: { type: string }
        message: { type: string, description: "Their words, exactly as sent. Whoever filled the form in chose every one." }
        site: { type: string }
        page: { type: string }
        via: { type: string }
        spam: { type: boolean }
        contact_id: { type: integer, format: int64, description: "The contact it was matched to; 0 for none." }
        company_id: { type: integer, format: int64, description: "The company it was matched to; 0 for none." }
        created_at: { type: string, format: date-time }
        state: { type: string, description: "`open`, `waiting` or `closed`; empty for one from before answering was tracked." }
        owner: { type: string }
        note: { type: string }
        company_name: { type: string, description: "The name of the company it was matched to; empty for none." }
        in_conversation: { type: boolean, description: "Whether whoever sent it is on the Conversations board already." }
        thread:
          type: array
          items: { $ref: "#/components/schemas/EnquiryMessage" }
          description: What has been said in answering it, oldest first, as its messages list gives it.

    EnquiryCounts:
      type: object
      required: [all, spam, kinds, states]
      properties:
        all: { type: integer, description: Every enquiry that isn't spam. }
        spam: { type: integer }
        kinds:
          type: object
          additionalProperties: { type: integer }
          description: "Those that aren't spam, by kind: `sales`, `demo`, `signup`, `support`, `feature` or `other`. A kind with none is left out."
        states:
          type: object
          additionalProperties: { type: integer }
          description: "Those that aren't spam, by `open`, `waiting` or `closed`. A state with none is left out."


    Suppression:
      type: object
      required: [id, address, reason, by, created_at]
      properties:
        id: { type: integer, format: int64 }
        address: { type: string }
        reason: { type: string, enum: [unsubscribed, added], description: "`unsubscribed` when they asked, by a link in a mail; `added` when a member or key put them here." }
        by: { type: string, description: Who added it; empty when they unsubscribed themselves. }
        created_at: { type: string, format: date-time }

    CampaignAudience:
      type: string
      enum: [conversations, customers]
      description: "`conversations`: everyone in conversation. `customers`: everyone at a company whose subscription has started and not ended, whether or not they ever replied."

    CampaignNew:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        audience: { type: string, description: "`conversations` or `customers`; empty is `conversations`, or `customers` for a service notice." }
        kind: { type: string, description: "`marketing`, or `service` for a notice to current customers about what they have; empty is `marketing`." }
        subject: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000, description: "Plain text. The postal address is added when it is sent, and for marketing an unsubscribe link." }

    CampaignChange:
      type: object
      properties:
        name: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        audience: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        kind: { type: string, nullable: true, x-go-type-skip-optional-pointer: false, description: "`marketing` or `service`; making a draft a service notice takes it to customers." }
        subject: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }
        body: { type: string, nullable: true, x-go-type-skip-optional-pointer: false }

    Campaign:
      type: object
      required: [id, name, kind, audience, subject, body, status, created_by, updated_by, created_at, updated_at, queued_by, queued_at, sent_at, paused, mail]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        kind: { $ref: "#/components/schemas/CampaignKind" }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [draft, sending, paused, sent, cancelled], description: "`draft` until it is sent; `sending` while its mails go out; `paused` when sending stopped by itself, with the reason in `paused`; `sent` once every mail has been dealt with; `cancelled` when someone stopped it." }
        created_by: { type: string }
        updated_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        queued_by: { type: string, description: Who sent it; empty for a draft. }
        queued_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        sent_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false, description: When the last of its mails went. }
        paused: { type: string, description: "Why sending stopped by itself; empty unless it is paused." }
        mail:
          type: object
          description: How many of its mails stand each way. Empty for a draft.
          additionalProperties: { type: integer }

    Recipient:
      type: object
      required: [contact_id, name, company, address, left_out]
      properties:
        contact_id: { type: integer, format: int64 }
        name: { type: string }
        company: { type: string }
        address: { type: string }
        left_out: { type: string, description: "Empty for someone it goes to; otherwise why it doesn't." }

    CampaignMail:
      type: object
      required: [id, address, contact_id, name, status, reason, sent_at]
      properties:
        id: { type: integer, format: int64 }
        address: { type: string, description: "Who it was to; `erased:` and a number once that person was erased." }
        contact_id: { type: integer, format: int64, description: "0 once that person was erased, or a restore dropped them." }
        name: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, unknown, skipped, cancelled], description: "`unknown`: the mail server stopped answering while it was being sent, so it may have gone; it is not sent again." }
        reason: { type: string, description: "Why it wasn't sent, or may not have been." }
        sent_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }

    CampaignKind:
      type: string
      enum: [marketing, service]
      description: |
        `marketing` honours the list not to be mailed and carries an unsubscribe link.
        `service` is a notice to current customers about what they have, such as a price
        or terms change: it goes only to customers, reaches people who unsubscribed from
        marketing, and carries no unsubscribe link. Never anyone on the never-contact list
        or erased. Anything promotional in it makes it marketing, whatever it is called.
    Agreement:
      type: object
      required: [id, company_id, name, status, file_name, file_size, file_hash, page_count, round, in_order, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        company_id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string, enum: [draft], description: "Every agreement is a draft until sending arrives." }
        file_name: { type: string, description: "Empty until a document is uploaded." }
        file_size: { type: integer, format: int64, description: In bytes. }
        file_hash: { type: string, description: "The document's SHA-256, in hex; empty until one is uploaded." }
        page_count: { type: integer, description: "The document's pages; 0 until one is uploaded, or for one uploaded before pages were counted." }
        round: { type: integer, description: "Which version this is, from 1; asking for changes starts the next." }
        in_order: { type: boolean, description: "Whether signers sign one after another, in their order." }
        created_by: { type: string }
        updated_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgreementOverview:
      allOf:
        - $ref: "#/components/schemas/Agreement"
        - type: object
          required: [company, problem, people, members]
          properties:
            company: { type: string, description: "The company's name." }
            problem: { type: string, description: "Why the document can't be read to place fields on it; empty when it can." }
            people:
              type: array
              items: { $ref: "#/components/schemas/Invitable" }
              description: People at the company who could still be added, by contact id.
            members:
              type: array
              items: { $ref: "#/components/schemas/Invitable" }
              description: Members who could still be added, by user id.
    AgreementRecipient:
      type: object
      required: [id, agreement_id, position, role, name, email, created_by, created_at]
      properties:
        id: { type: integer, format: int64 }
        agreement_id: { type: integer, format: int64 }
        position: { type: integer, description: "Their place in the order, from 1." }
        role: { type: string, enum: [signer, copy] }
        contact_id: { type: integer, format: int64, nullable: true, x-go-type-skip-optional-pointer: false }
        member_id: { type: integer, format: int64, nullable: true, x-go-type-skip-optional-pointer: false, description: "A member's user id." }
        name: { type: string, description: "As they are named now; sending will freeze it." }
        email: { type: string, description: "Where it will go; sending will freeze it." }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    AgreementFieldIn:
      type: object
      required: [recipient_id, page, kind, x, y, w, h]
      properties:
        recipient_id: { type: integer, format: int64, description: "One of the agreement's signers." }
        page: { type: integer, minimum: 1 }
        kind: { type: string, enum: [signature, initials, name, date, text, tick] }
        x: { type: number, minimum: 0, maximum: 1, description: "From the page's left edge, as a fraction of its width." }
        y: { type: number, minimum: 0, maximum: 1, description: "From the page's top edge, as a fraction of its height." }
        w: { type: number, minimum: 0.01, maximum: 1 }
        h: { type: number, minimum: 0.01, maximum: 1 }
    AgreementField:
      allOf:
        - $ref: "#/components/schemas/AgreementFieldIn"
        - type: object
          required: [id, round]
          properties:
            id: { type: integer, format: int64 }
            round: { type: integer }
