openapi: 3.0.3
info:
  title: Prospector
  version: "1"
  description: |
    Everything Prospector does, for people and robots alike. The web app uses this
    API with its session; an agent or script uses it with an API key
    (`Authorization: Bearer pk_…`) whose scopes say what it may do.

    Scopes: `read` to read; `agents:run` to start and stop agent runs;
    `agents:configure` to add, change and delete the organisation's agents;
    `enquiries:reply` to email a reply to an enquiry and record its answer. A signed-in
    member may read and run; configuring needs an owner.
servers:
  - url: /
security:
  - session: []
  - bearer: []
tags:
  - name: agents
    description: Prospector's own agents, each a model behind an endpoint with tools from an MCP server.
  - name: runs
    description: An agent working a task.
  - name: enquiries
    description: What people sent in through a site's form or a product, and answering them.

paths:
  /o/{org}/api/v1/agents:
    parameters:
      - $ref: "#/components/parameters/org"
    get:
      operationId: listAgents
      tags: [agents]
      summary: The organisation's agents
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: Every agent, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgent
      tags: [agents]
      summary: Add an agent
      description: |
        Saving checks the endpoint's model list and the tool server's tools. A check that
        fails, as when a daily limit is spent, is reported in `problem` without stopping the save.
      security:
        - session: []
        - bearer: ["agents:configure"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettings" }
      responses:
        "201":
          description: The agent as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSaved" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: getAgent
      tags: [agents]
      summary: One agent
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAgent
      tags: [agents]
      summary: Change an agent
      description: |
        Replaces the agent's settings. An empty `api_key` keeps the saved one, as long as
        the kind and endpoint stay the same; an empty `kind` keeps the agent's kind.
      security:
        - session: []
        - bearer: ["agents:configure"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettings" }
      responses:
        "200":
          description: The agent as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSaved" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      description: Stops its runs, revokes its built-in key and clears it as any agent's fallback.
      security:
        - session: []
        - bearer: ["agents:configure"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/tasks/{task}/runs:
    parameters:
      - $ref: "#/components/parameters/org"
      - name: task
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listRuns
      tags: [runs]
      summary: A task's agent runs
      description: Every run still going, then the latest that ended.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startRun
      tags: [runs]
      summary: Start an agent on the task
      security:
        - session: []
        - bearer: ["agents:run"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: integer, format: int64, description: The agent's id. }
      responses:
        "201":
          description: The run, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/runs/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: stopRun
      tags: [runs]
      summary: Stop a run
      description: The run stops at its next step; one already ended is left as it is.
      security:
        - session: []
        - bearer: ["agents:run"]
      responses:
        "204": { description: Asked to stop. }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    get:
      operationId: listEnquiryMessages
      tags: [enquiries]
      summary: What has been said in answering an enquiry
      description: Replies sent from here and what was recorded of their answers, oldest first. The enquiry's own message is on the enquiry.
      security:
        - session: []
        - bearer: [read]
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnquiryMessage" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: replyToEnquiry
      tags: [enquiries]
      summary: Email a reply to whoever wrote in
      description: |
        Sends `text`, and only that, to the address the enquiry gave, through the
        organisation's mail server. Nothing from the enquiry is quoted in the mail. Their
        answer goes to the member who sent it; a key's reply is answered to the mail
        server's own address. Refused for spam, for an address on the never-contact list,
        and for the same words twice within two minutes. Afterwards the enquiry is
        `waiting`. If the mail server refuses it the answer is 502 and nothing is recorded.
      security:
        - session: []
        - bearer: ["enquiries:reply"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryText" }
      responses:
        "201":
          description: The reply as sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryMessage" }
        default: { $ref: "#/components/responses/Problem" }

  /o/{org}/api/v1/enquiries/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/org"
      - $ref: "#/components/parameters/id"
    post:
      operationId: recordEnquiryAnswer
      tags: [enquiries]
      summary: Record what they said back
      description: Their answer arrives in a mailbox, not here, so whoever reads it records it. Nothing is sent. Afterwards the enquiry is `open` again.
      security:
        - session: []
        - bearer: ["enquiries:reply"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryText" }
      responses:
        "201":
          description: The answer as recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryMessage" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: A signed-in browser. Requests must come from Prospector's own pages.
    bearer:
      type: http
      scheme: bearer
      description: An API key, `pk_…`, made on the organisation's Agents page.

  parameters:
    org:
      name: org
      in: path
      required: true
      description: The organisation's slug.
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Problem:
      description: What went wrong (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    AgentKind:
      type: string
      enum: [openai, anthropic]
      description: "`openai` is any OpenAI-compatible endpoint; `anthropic` is Claude through Anthropic's own API."

    AgentSettings:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 40 }
        kind:
          type: string
          description: "`openai` or `anthropic`; empty keeps an existing agent's kind, and is `openai` for a new one."
        base_url:
          type: string
          description: The endpoint. Required for `openai`; for `anthropic`, empty is Anthropic's own.
        api_key:
          type: string
          writeOnly: true
          description: Sealed when saved and never returned. Empty keeps the saved key.
        model: { type: string, maxLength: 200 }
        tools_url: { type: string, description: An MCP server whose tools the agent may use. }
        search_url:
          type: string
          description: A SearXNG instance, with `json` among its `search.formats`, that the built-in `web_search` asks. Empty, the agent has no search of its own; it can still read pages with `fetch_page`.
        tools:
          type: array
          items: { type: string }
          description: The tools it may use, from those the tool server lists.
        fallback:
          type: integer
          format: int64
          description: The agent that takes its task over when its endpoint stays limited or away; 0 for none.
        fallback_minutes:
          type: integer
          description: How long it waits before falling back, 1 to 10080; 0 is 15.

    Agent:
      type: object
      required: [id, name, kind, base_url, model, tools_url, search_url, models, tools, allowed_tools, fallback, fallback_minutes, problem, checked_at, has_key, ready, updated_by, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AgentKind" }
        base_url: { type: string }
        model: { type: string }
        tools_url: { type: string }
        search_url: { type: string }
        models:
          type: array
          items: { type: string }
          description: The models the endpoint listed when last checked.
        tools:
          type: array
          items: { $ref: "#/components/schemas/Tool" }
          description: The tools the tool server listed when last checked.
        allowed_tools:
          type: array
          items: { type: string }
        fallback: { type: integer, format: int64 }
        fallback_minutes: { type: integer }
        problem: { type: string, description: "What the last check found wrong, if anything." }
        checked_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        has_key: { type: boolean }
        ready: { type: boolean, description: Whether it has what it needs to be run. }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }

    AgentSaved:
      type: object
      required: [agent, message]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        message: { type: string, description: "A sentence saying how the save went, for a person." }

    Tool:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    RunStatus:
      type: string
      enum: [running, waiting, finished, stopped, failed]

    Run:
      type: object
      required: [id, task, agent, agent_name, request, started_by, model, status, stop_asked, started_at, ended_at, wait_until, turns, episodes, tool_calls, added, resumes, tokens_in, tokens_out, stop_reason]
      properties:
        id: { type: integer, format: int64 }
        task: { type: integer, format: int64 }
        agent: { type: integer, format: int64 }
        agent_name: { type: string }
        request: { type: integer, format: int64, description: "The request it is working, 0 before it has one." }
        started_by: { type: string }
        model: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        stop_asked: { type: boolean }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }
        wait_until: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false, description: When a waiting run asks its endpoint again. }
        turns: { type: integer }
        episodes: { type: integer }
        tool_calls: { type: integer }
        added: { type: integer, description: What it added to Research. }
        resumes: { type: integer }
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        stop_reason: { type: string }

    EnquiryText:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 10000 }

    EnquiryMessage:
      type: object
      required: [id, enquiry_id, ours, text, by, sent_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        enquiry_id: { type: integer, format: int64 }
        ours: { type: boolean, description: "True for a reply sent from here, false for what they said back." }
        text: { type: string }
        by: { type: string, description: "Who sent the reply, or recorded their answer." }
        sent_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false, description: When a reply of ours left. }
        created_at: { type: string, format: date-time }
